<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Analysis Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .badge { font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h1 class="card-title text-center mb-4">YouTube Comment Analysis</h1>
                <h5 class="text-center text-muted mb-4">Results for: <a href="{{ video_url }}" target="_blank">{{ video_url }}</a></h5>
                <hr>
                
                <ul class="list-group list-group-flush mt-4">
                    {% for result in results %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <p class="mb-0 me-3">"{{ result.comment }}"</p>
                            <span class="badge 
                                {% if result.prediction == 'Sarcastic' %} bg-warning text-dark
                                {% elif result.prediction == 'Humor' %} bg-info text-dark
                                {% else %} bg-secondary
                                {% endif %}
                            ">{{ result.prediction }}</span>
                        </li>
                    {% else %}
                        <li class="list-group-item">No comments were found or an error occurred.</li>
                    {% endfor %}
                </ul>

                <div class="text-center mt-5">
                    <a href="/" class="btn btn-primary">Analyze Another Video</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
