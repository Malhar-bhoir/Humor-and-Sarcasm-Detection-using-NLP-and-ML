<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .prediction-badge {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-5 text-center">
                        <h1 class="card-title mb-4">Analysis Result</h1>
                        
                        <div class="mb-4">
                            <p class="text-muted">Original Text:</p>
                            <p class="lead"><em>"{{ original_text }}"</em></p>
                        </div>

                        <hr>
                        
                        <div class="mt-4">
                            <p class="text-muted">Predicted Category:</p>
                            <h3>
                                <span class="badge bg-success prediction-badge">{{ prediction }}</span>
                            </h3>
                        </div>

                        <a href="/" class="btn btn-secondary mt-5">Analyze Another Text</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
