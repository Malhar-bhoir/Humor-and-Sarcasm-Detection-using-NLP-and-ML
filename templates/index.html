<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarcasm & Humor Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Analyze Text ✍️</h2>
                        <form action="/predict" method="post">
                            <div class="mb-3">
                                <textarea class="form-control" name="text" rows="4" placeholder="Paste any text here..." required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Analyze Text</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Analyze YouTube Comments 🎬</h2>
                        <form action="/analyze_youtube" method="post">
                            <div class="mb-3">
                                <input type="url" class="form-control" name="youtube_url" placeholder="Paste a YouTube video URL here..." required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-danger">Fetch & Analyze Comments</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
